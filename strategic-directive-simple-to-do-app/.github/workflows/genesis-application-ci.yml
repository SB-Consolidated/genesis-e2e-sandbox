name: Genesis Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Validate governed branch name
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(ticket|hotfix)/TICKET-[0-9]{3}(-[a-z0-9]+)*$ ]]; then
            echo "Branch $BRANCH is not a governed ticket or hotfix branch."
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build --if-present
      - name: Lint
        run: npm run lint --if-present
      - name: Test
        run: npm test --if-present
      - name: Coverage floor
        run: npm run test:coverage --if-present
      - name: Dependency audit
        run: npm audit --audit-level=high