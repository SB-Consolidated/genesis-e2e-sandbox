name: Genesis Application CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: strategic-directive-simple-to-do-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: strategic-directive-simple-to-do-app/package-lock.json
      - name: Validate governed branch name
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          BRANCH="${{ github.head_ref }}"
          if [[ ! "$BRANCH" =~ ^(ticket|hotfix)/TICKET-[0-9]{3}(-[a-z0-9]+)*$ ]]; then
            echo "Branch $BRANCH is not a governed ticket or hotfix branch."
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: UI E2E
        run: npm run ui:e2e
      - name: Dependency audit
        run: npm audit --audit-level=high
